<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>오라씨오 성가대 1주년 인기 특송 Top 10</title>
<meta name="description" content="오라씨오 성가대 1주년. 지난 1년 동안 가장 많이 들은 인기 특송 Top 10을 1위부터 모았습니다.">
<meta name="theme-color" content="#1B1430">

<!-- ▼▼ 카카오톡·페이스북 공유 카드 설정 ─────────────────────────────
     GitHub Pages 주소로 채워 두었습니다.
     (https://atinjin.github.io/atinjin-pages/oratio/)
     카카오톡은 한 번 읽은 정보를 저장해 두므로, 주소를 먼저 채운 뒤
     공유하시는 편이 좋습니다. ────────────────────────────────── -->
<meta property="og:url" content="https://atinjin.github.io/atinjin-pages/oratio/">
<link rel="canonical" href="https://atinjin.github.io/atinjin-pages/oratio/">
<meta property="og:type" content="website">
<meta property="og:locale" content="ko_KR">
<meta property="og:site_name" content="오라씨오 성가대">
<meta property="og:title" content="오라씨오 성가대 1주년 인기 특송 Top 10">
<meta property="og:description" content="지난 1년 동안 가장 많이 들은 특송 Top 10, 1위부터 10위까지.">
<meta property="og:image" content="https://img.youtube.com/vi/0qD4lwmup9I/maxresdefault.jpg">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="720">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231B1430'/%3E%3Cpath d='M16 4 L18.6 13.4 L28 16 L18.6 18.6 L16 28 L13.4 18.6 L4 16 L13.4 13.4 Z' fill='%23C9A45C'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-deep:#1B1430; --panel:#2A2049;
    --brass:#C9A45C; --brass-lit:#EBD3A0;
    --ivory:#F4EDE0;  --ash:#A296B8;
    --m1:#E0BC72; --m2:#C4C8D6; --m3:#B98460;
    --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic","맑은 고딕",sans-serif;
    --serif:"Gowun Batang",serif;
    --num:"Cormorant Garamond",serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--ink-deep);color:var(--ivory);font-family:var(--sans);
    overflow-x:hidden;word-break:keep-all;overflow-wrap:break-word}
  body::before{content:"";position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(760px 420px at 50% -8%,rgba(201,164,92,.20),transparent 68%),
      radial-gradient(620px 480px at 105% 30%,rgba(120,80,175,.22),transparent 70%),
      linear-gradient(180deg,#1B1430 0%,#241A3D 45%,#170F29 100%)}
  .wrap{max-width:540px;margin:0 auto;
    padding:calc(26px + env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom))}

  /* ── 머리말 ─────────────────────────────── */
  .mark{font-family:var(--num);font-weight:500;font-size:.95rem;letter-spacing:.52em;
    color:var(--brass);margin:0 0 16px;text-indent:.52em}
  .eyebrow{font-size:.7rem;letter-spacing:.2em;color:var(--ash);margin:0 0 12px}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(1.9rem,8.4vw,2.6rem);
     line-height:1.3;margin:0;text-wrap:balance}
  h1 em{font-style:normal;color:var(--brass-lit)}
  .rule{display:flex;align-items:center;gap:12px;margin:20px 0 18px;color:var(--brass)}
  .rule::before,.rule::after{content:"";height:1px;flex:1;
    background:linear-gradient(90deg,transparent,rgba(201,164,92,.5),transparent)}
  .rule span{font-size:.7rem}
  .lede{margin:0;color:var(--ash);font-size:.86rem;line-height:1.75}
  .tools{display:flex;gap:8px;margin:20px 0 24px}
  .tool{flex:1;min-height:46px;border-radius:999px;cursor:pointer;
    border:1px solid rgba(201,164,92,.34);background:rgba(244,237,224,.04);
    color:var(--ivory);font-family:var(--sans);font-size:.83rem;transition:background .2s}
  .tool:active{background:rgba(201,164,92,.16)}
  .tool:focus-visible,.cover:focus-visible,.link:focus-visible{outline:2px solid var(--brass-lit);outline-offset:3px}
  .note{display:none;margin:0 0 22px;padding:11px 13px;border-radius:10px;font-size:.75rem;
    line-height:1.65;color:var(--ash);border:1px solid rgba(201,164,92,.24);
    background:rgba(201,164,92,.06)}
  .note b{color:var(--brass-lit);font-weight:400}

  /* ── 카드 ─────────────────────────────── */
  .card{position:relative;margin-bottom:12px;border-radius:16px;overflow:hidden;
    background:linear-gradient(180deg,rgba(244,237,224,.055),rgba(244,237,224,.018));
    border:1px solid rgba(201,164,92,.15);opacity:0;transform:translateY(16px);
    transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.3,1),border-color .3s}
  .card.in{opacity:1;transform:none}
  .card.pick{border-color:rgba(235,211,160,.75);box-shadow:0 0 0 3px rgba(235,211,160,.16)}

  .cover{display:block;width:100%;padding:0;border:0;text-decoration:none;color:inherit;
    position:relative;aspect-ratio:16/9;cursor:pointer;overflow:hidden;background:#170F29}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;
    filter:saturate(.92) brightness(.92)}
  .cover img.gone{display:none}
  .cover iframe{position:absolute;inset:0;width:100%;height:100%;border:0;z-index:3}
  .veil{position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg,rgba(23,15,41,.12) 0,transparent 34%,rgba(23,15,41,.86) 100%)}

  /* 그림이 막히면 드러나는 자체 표지 */
  .fb{position:absolute;inset:0;z-index:0;display:grid;align-content:center;justify-items:center;
    gap:7px;padding:14px 46px;text-align:center;
    background:radial-gradient(115% 88% at 50% 4%,hsl(var(--h) 38% 31%),transparent 72%),
               linear-gradient(158deg,#2E2250,#170F29)}
  .fb i{font-style:normal;color:var(--brass);font-size:.82rem;letter-spacing:.3em;opacity:.85}
  .fb strong{font-family:var(--serif);font-weight:700;font-size:1.18rem;color:var(--brass-lit);line-height:1.35}
  .fb small{font-size:.7rem;color:var(--ash)}

  .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
    width:54px;height:54px;border-radius:50%;display:grid;place-items:center;
    background:rgba(23,15,41,.5);border:1px solid rgba(244,237,224,.42);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  .play svg{width:17px;height:17px;fill:var(--ivory);margin-left:2px}

  /* 성가 번호판 */
  .plate{position:relative;overflow:hidden;display:grid;place-items:center;
    background:linear-gradient(160deg,#3A2C55,#1D1533);
    border:1px solid rgba(201,164,92,.42);border-radius:6px;
    box-shadow:inset 0 1px 0 rgba(235,211,160,.22),0 3px 12px rgba(0,0,0,.45)}
  .plate b{font-family:var(--num);font-weight:600;line-height:1;color:var(--brass-lit)}
  .plate::after{content:"";position:absolute;inset:0;transform:translateX(-130%);
    background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.5) 50%,transparent 62%)}
  .card.in .plate::after{animation:sheen 1.05s .3s ease-out forwards}
  @keyframes sheen{to{transform:translateX(130%)}}
  .r1 .plate b{color:var(--m1)} .r2 .plate b{color:var(--m2)} .r3 .plate b{color:var(--m3)}
  .r2 .plate{border-color:rgba(196,200,214,.4)} .r3 .plate{border-color:rgba(185,132,96,.45)}

  .medal{position:absolute;right:10px;top:10px;z-index:4;font-size:.7rem;letter-spacing:.04em;
    padding:5px 10px;border-radius:999px;background:rgba(23,15,41,.62);
    border:1px solid rgba(235,211,160,.42);
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

  .meta{padding:13px 15px 15px}
  .title{font-family:var(--serif);font-weight:700;margin:0;letter-spacing:-.01em}
  .credit{margin:5px 0 0;color:var(--ash);font-size:.78rem;line-height:1.5}
  .tag{display:inline-block;margin-top:9px;font-size:.66rem;letter-spacing:.1em;color:var(--brass);
    border:1px solid rgba(201,164,92,.3);border-radius:4px;padding:3px 8px}
  .link{display:inline-block;margin-top:11px;margin-left:8px;font-size:.72rem;color:var(--ash);
    text-decoration:none;border-bottom:1px solid rgba(162,150,184,.35);padding-bottom:1px}

  .card--hero .plate{position:absolute;left:12px;bottom:12px;z-index:4;width:52px;height:56px}
  .card--hero .plate b{font-size:2.5rem}
  .card--hero .title{font-size:1.28rem}

  .card--row{display:grid;grid-template-columns:38px 104px 1fr;align-items:center;gap:11px;padding:10px}
  .card--row .plate{width:38px;height:44px}
  .card--row .plate b{font-size:1.5rem}
  .card--row .cover{border-radius:9px}
  .card--row .veil{background:linear-gradient(180deg,rgba(23,15,41,.05),rgba(23,15,41,.45))}
  .card--row .play{width:34px;height:34px}
  .card--row .play svg{width:11px;height:11px}
  .card--row .fb{padding:6px} .card--row .fb i{font-size:1.15rem;letter-spacing:0}
  .card--row .fb strong,.card--row .fb small{display:none}
  .card--row .meta{padding:0}
  .card--row .title{font-size:.98rem;line-height:1.4}
  .card--row .credit{font-size:.73rem;margin-top:3px}
  .card--row .tag,.card--row .link{display:none}

  footer{margin-top:34px;text-align:center;color:var(--ash);font-size:.78rem;line-height:1.9}
  footer .fmark{color:var(--brass);font-size:.8rem;letter-spacing:.4em;display:block;margin-bottom:10px}
  .bar{position:fixed;left:0;top:0;height:2px;width:0;z-index:9;
    background:linear-gradient(90deg,var(--brass),var(--brass-lit))}

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .card{opacity:1;transform:none;transition:none}
    .card.in .plate::after{animation:none}
  }
</style>
</head>
<body>
<div class="bar" id="bar"></div>

<div class="wrap">
  <header>
    <p class="mark">ORATIO</p>
    <p class="eyebrow">오라씨오 성가대 · 1주년</p>
    <h1>인기 특송<br><em>Top 10</em></h1>
    <div class="rule"><span>✦</span></div>
    <p class="lede" id="lede">지난 1년 동안 가장 많이 찾아 들으신 특송을 1위부터 모았습니다.<br>표지를 누르면 그 자리에서 바로 재생됩니다.</p>
    <div class="tools">
      <button class="tool" id="orderBtn">10위부터 보기</button>
      <button class="tool" id="pickBtn">오늘의 한 곡</button>
    </div>
    <p class="note" id="note"><b>미리보기 안내</b><br>이 창에서는 유튜브 썸네일과 내장 재생이 막혀 있어 자체 표지로 보입니다. 파일을 내려받아 브라우저에서 열면 썸네일과 재생이 모두 정상으로 나옵니다.</p>
  </header>

  <main id="chart"></main>

  <footer>
    <span class="fmark">✦✦✦</span>
    오라씨오 성가대 1주년<br>한 해 동안 함께 불러 주신 모든 분께 고맙습니다.
  </footer>
</div>

<script>
/* ───────────────────────────────────────────────
   곡 목록 — 이 부분만 고치면 순위표가 바뀝니다.
   views 칸에 조회수를 적으면 이름 옆에 함께 나옵니다. 예) views:"1.2만 회"
   ─────────────────────────────────────────────── */
const SONGS = [
  {rank:1,  vid:"0qD4lwmup9I", title:"사명",          credit:"이권희",                    tag:"봉헌 · 파견", views:""},
  {rank:2,  vid:"worrj2KO3u0", title:"Ave Maria",     credit:"강나현 비비아나",            tag:"성모 성가",  views:""},
  {rank:3,  vid:"UsT1KRjdyLo", title:"Anima Christi", credit:"Marco Frisina",             tag:"라틴 성가",  views:""},
  {rank:4,  vid:"cSw9GENhwNA", title:"당신께 가는 길",  credit:"김상균 라우렌시오",          tag:"성가",      views:""},
  {rank:5,  vid:"QPKNBadGAL4", title:"축복합니다",      credit:"박수진 안젤라",              tag:"축복",      views:""},
  {rank:6,  vid:"w_JFy8aaIvk", title:"평화의 기도",     credit:"Allen Pote",                tag:"합창",      views:""},
  {rank:7,  vid:"rtiGY7YdzDk", title:"Ave Maria",     credit:"Libera · Robert Prizeman",  tag:"성모 성가",  views:""},
  {rank:8,  vid:"_R1tarfCff0", title:"부활의 소식",     credit:"최덕신",                    tag:"부활",      views:""},
  {rank:9,  vid:"OU7ddCV4__Q", title:"잊지 말아요",     credit:"김도훈 작곡 · 백지영 노래",   tag:"가요",      views:""},
  {rank:10, vid:"aDn-6t9iWbI", title:"시편 23편",      credit:"유미진 라파엘라",            tag:"시편",      views:""}
];

/* 미리보기(iframe) 안에서는 내장 재생이 막히므로 유튜브로 바로 넘깁니다 */
const BOXED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

const chart = document.getElementById('chart');
const orderBtn = document.getElementById('orderBtn');
const pickBtn = document.getElementById('pickBtn');
const PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 0l14 8-14 8z"/></svg>';

let countdown = false, playing = null;
const revealed = new Set();
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

if (BOXED) {
  document.getElementById('note').style.display = 'block';
  document.getElementById('lede').innerHTML =
    '지난 1년 동안 가장 많이 찾아 들으신 특송을 1위부터 모았습니다.<br>표지를 누르면 유튜브에서 열립니다.';
}

function cardHTML(s){
  const big = s.rank <= 3 || playing === s.vid;
  const live = playing === s.vid;
  const medal = {1:'🥇 1위',2:'🥈 2위',3:'🥉 3위'}[s.rank];
  const plate = '<span class="plate"><b>' + s.rank + '</b></span>';
  const fb = '<span class="fb"><i>✦</i><strong>' + esc(s.title) + '</strong><small>' + esc(s.credit) + '</small></span>';

  let cover;
  if (live) {
    cover = '<div class="cover">' + fb +
      '<iframe src="https://www.youtube.com/embed/' + s.vid + '?autoplay=1&rel=0&playsinline=1" title="' +
      esc(s.title) + '" allow="accelerometer;autoplay;encrypted-media;gyroscope;picture-in-picture;web-share" allowfullscreen></iframe>' +
      (big ? plate : '') + '</div>';
  } else {
    const guts = fb +
      '<img src="https://img.youtube.com/vi/' + s.vid + '/maxresdefault.jpg" alt="" loading="lazy" decoding="async">' +
      '<span class="veil"></span><span class="play">' + PLAY + '</span>' + (big ? plate : '');
    cover = BOXED
      ? '<a class="cover" href="https://youtu.be/' + s.vid + '" target="_blank" rel="noopener" aria-label="' + esc(s.title) + ' 유튜브에서 열기">' + guts + '</a>'
      : '<button class="cover" data-vid="' + s.vid + '" aria-label="' + esc(s.title) + ' 재생">' + guts + '</button>';
  }

  const info = '<div class="meta"><h2 class="title">' + esc(s.title) + '</h2>' +
    '<p class="credit">' + esc(s.credit) + (s.views ? ' · ' + esc(s.views) : '') + '</p>' +
    '<span class="tag">' + esc(s.tag) + '</span>' +
    '<a class="link" href="https://youtu.be/' + s.vid + '" target="_blank" rel="noopener">유튜브에서 보기 ↗</a></div>';

  const shell = 'class="card ' + (big ? 'card--hero' : 'card--row') + ' r' + s.rank + ' ' +
    (revealed.has(s.vid) ? 'in' : '') + '" data-key="' + s.vid + '" style="--h:' + (250 + s.rank * 6) + '"';

  return big
    ? '<article ' + shell + '>' + (medal && !live ? '<span class="medal">' + medal + '</span>' : '') + cover + info + '</article>'
    : '<article ' + shell + '>' + plate + cover + info + '</article>';
}

function render(){
  const list = countdown ? [...SONGS].reverse() : SONGS;
  chart.innerHTML = list.map(cardHTML).join('');
  chart.querySelectorAll('.cover img').forEach(img => {
    const swap = function(){
      if (this.src.indexOf('maxres') > -1) this.src = this.src.replace('maxresdefault','hqdefault');
      else this.classList.add('gone');
    };
    img.addEventListener('error', swap);
    if (img.complete && img.naturalWidth === 0) swap.call(img);
  });
  chart.querySelectorAll('.card').forEach(c => io.observe(c));
}

const io = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add('in');
    revealed.add(e.target.dataset.key);
    io.unobserve(e.target);
  });
}, {rootMargin:'0px 0px -8% 0px', threshold:.12});

chart.addEventListener('click', e => {
  const btn = e.target.closest('.cover');
  if (!btn || !btn.dataset.vid) return;
  playing = btn.dataset.vid;
  render();
  chart.querySelector('[data-key="' + playing + '"]').scrollIntoView({behavior:'smooth', block:'nearest'});
});

orderBtn.addEventListener('click', () => {
  countdown = !countdown;
  playing = null;
  orderBtn.textContent = countdown ? '1위부터 보기' : '10위부터 보기';
  render();
  window.scrollTo({top:0, behavior:'smooth'});
});

pickBtn.addEventListener('click', () => {
  const s = SONGS[Math.floor(Math.random() * SONGS.length)];
  if (BOXED) { window.open('https://youtu.be/' + s.vid, '_blank', 'noopener'); return; }
  playing = s.vid;
  render();
  const card = chart.querySelector('[data-key="' + s.vid + '"]');
  card.classList.add('in','pick');
  card.scrollIntoView({behavior:'smooth', block:'center'});
  setTimeout(() => card.classList.remove('pick'), 2600);
});

const bar = document.getElementById('bar');
addEventListener('scroll', () => {
  const h = document.body.scrollHeight - innerHeight;
  bar.style.width = (h > 0 ? scrollY / h * 100 : 0) + '%';
}, {passive:true});

render();
</script>
</body>
</html>
